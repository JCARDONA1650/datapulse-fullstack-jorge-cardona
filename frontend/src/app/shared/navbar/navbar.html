<mat-toolbar>
  <span class="marca" routerLink="/dashboard">
    <img src="favicon.png" alt="" class="logo" />
    DataPulse Latam
  </span>
  <span class="espacio"></span>
  @if (usuario$ | async; as usuario) {
    <app-alerta-badge />
    <span class="usuario" routerLink="/perfil">{{ usuario.nombre_completo }}</span>
    <button mat-button (click)="cerrarSesion()">Salir</button>
  }
</mat-toolbar>
