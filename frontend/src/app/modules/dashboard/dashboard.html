<div class="dashboard-container">
  <app-kpi-cards [resumen]="resumen()" />

  <div class="fila-dos-columnas">
    <mat-card>
      <mat-card-subtitle>Mapa de riesgo - Latinoamerica</mat-card-subtitle>
      <app-mapa-riesgo [puntos]="mapa()" />
    </mat-card>

    <mat-card>
      <mat-card-subtitle>Ranking de paises por IRPC</mat-card-subtitle>
      <app-tabla-ranking [ranking]="ranking()?.results ?? []" />
    </mat-card>
  </div>

  <mat-card class="tarjeta-tendencias">
    <mat-card-subtitle>Tendencias historicas (5 anios)</mat-card-subtitle>
    <app-grafico-tendencias />
  </mat-card>
</div>
